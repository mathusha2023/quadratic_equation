name: CI Workflow

on:
  push:
    branches: [main, test]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Clear
        run: rm -rf ./*

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64

      - name: Install Raylib
        run: |
          sudo apt-get update && sudo apt-get install -y cmake git libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev

          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC

          cp libraylib.a ../../
          cp raylib.h ../../
          cd ../../
          rm -rf raylib

      - name: Compile and run tests
        run: ./compile.sh
